kind = "web"
previewPath = "/"
title = "HUMN"
description = "HUMN — MAKE AI HUMAN. A scroll-film website for a premium AI interaction layer: one continuous cinematic ascent (BEDROCK → CONTEXT → TONE → NUANCE → TRUST → SURFACE) built with pure-code GSAP/Lenis motion, resolving into product, capabilities, and access content."
version = "1.0.0"
id = "artifacts/humn"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23414

[services.development]
run = "pnpm --filter @workspace/humn run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/humn", "run", "build" ]
serve = "static"
publicDir = "artifacts/humn/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23414"
BASE_PATH = "/"
